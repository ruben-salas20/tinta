# Prueba el código y publica la imagen del servicio, con la web dentro.
#
# - En cada PR y en main: pasan las pruebas del servicio y de la web.
# - En main y en las etiquetas vX.Y.Z: sube la imagen a
#   ghcr.io/ruben-salas20/tinta-server con las etiquetas main, sha-XXXXXXX
#   y, en una etiqueta, vX.Y.Z y latest.
name: Imagen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
      - name: Pruebas del servicio
        run: cargo test --locked -p tinta-server
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pruebas y compilación de la web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
          npm run check
          npm run build

  imagen:
    needs: pruebas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ruben-salas20/tinta-server
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=servidor
          cache-to: type=gha,mode=max,scope=servidor
